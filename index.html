<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Estante!</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#f2eff8;--surface:#fbfaff;--ink:#261d33;--muted:#7a6f8c;--line:#ddd5ec;--wood:#4b3a68;--accent:#6b3fb5;--star:#b98a12;--danger:#b1443a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f1d;--surface:#1e1729;--ink:#ece6f5;--muted:#9d92b3;--line:#342a46;--wood:#3a2d55;--accent:#b79cf0;--star:#e0b54a;--danger:#e0786d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140f1d;--surface:#1e1729;--ink:#ece6f5;--muted:#9d92b3;--line:#342a46;--wood:#3a2d55;--accent:#b79cf0;--star:#e0b54a;--danger:#e0786d;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:960px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 30px/1.1 Literata,Georgia,serif;color:var(--accent)}
.summary{margin:8px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;margin-bottom:-1px;color:var(--muted);font:600 14px system-ui;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs small{font-size:12px;opacity:.75}
main{max-width:960px;margin:0 auto;padding:4px 20px 60px}
.month{margin-top:26px}
.month h2{margin:0;font:600 18px Literata,Georgia,serif}
.month h2 span{margin-left:10px;font:400 13px system-ui;color:var(--muted)}
.shelf{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;min-height:200px;padding:20px 12px 0;margin-top:10px;border-bottom:10px solid var(--wood)}
.bk{width:50px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);cursor:pointer}
.spine{display:block;width:46px;height:150px;padding:10px 4px;border-radius:3px;color:#fff;font:600 12px/1.25 Literata,Georgia,serif;writing-mode:vertical-rl;transform:rotate(180deg);overflow:hidden;white-space:nowrap;box-shadow:inset 3px 0 0 rgba(255,255,255,.15),inset -3px 0 0 rgba(0,0,0,.2)}
.bk small{font-size:11px;letter-spacing:1px;color:var(--star);white-space:nowrap}
.empty{margin:44px 0;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:600 14px system-ui;cursor:pointer}
dialog{width:min(500px,94vw);padding:0;border:0;border-radius:12px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.form{display:flex;flex-direction:column;gap:14px;padding:22px}
.form h2{margin:0;font:700 20px Literata,Georgia,serif;color:var(--accent)}
label,.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px system-ui}
textarea{resize:vertical;font-family:Literata,Georgia,serif;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#stars{display:flex;gap:2px}
.st{padding:0 3px;border:0;background:none;color:var(--line);font-size:26px;line-height:1;cursor:pointer}
.st.on{color:var(--star)}
.actions{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.ghost{background:none;border:0;padding:8px 10px;color:var(--muted);font:600 14px system-ui;cursor:pointer}
.danger{background:none;border:1px solid var(--danger);border-radius:999px;padding:8px 14px;color:var(--danger);font:600 14px system-ui;cursor:pointer}
.reading{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.rd{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;cursor:pointer}
.rd-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-width:0}
.rd-top b{font:600 16px Literata,Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-top em{font-style:normal;font-weight:700;color:var(--accent)}
.bar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.rd-sub{font-size:13px;color:var(--muted)}
input[type=color]{width:64px;height:38px;padding:3px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Minha Estante!</h1>
    <button class="primary" id="add">Adicionar livro</button>
  </div>
  <p class="summary" id="summary"></p>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>

<dialog id="dlg">
  <form id="frm" class="form" autocomplete="off">
    <h2 id="dlgTitle">Novo livro</h2>
    <label>Título<input name="title" required maxlength="120"></label>
    <label>Autor<input name="author" maxlength="120"></label>
    <div class="row">
      <label>Páginas<input name="pages" type="number" min="0" inputmode="numeric"></label>
      <label>Estante<select name="status">
        <option value="quero">Quero ler</option>
        <option value="lendo">Lendo</option>
        <option value="lido">Lido</option>
      </select></label>
    </div>
    <label id="mesWrap">Mês de leitura<input name="month" type="month"></label>
    <label id="pagWrap">Página atual<input name="current" type="number" min="0" inputmode="numeric"></label>
    <label>Cor da capa<input name="color" type="color"></label>
    <div class="field">Nota<div id="stars"></div></div>
    <label>Resenha<textarea name="review" rows="7" placeholder="O que ficou com você? Personagens, ritmo, o final…"></textarea></label>
    <div class="actions">
      <button type="button" class="danger" id="del" hidden>Excluir</button>
      <span class="grow"></span>
      <button type="button" class="ghost" id="cancel">Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'minha-estante-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {quero:'Quero ler', lendo:'Lendo', lido:'Lidos'};
const CORES = ['#6b3fb5','#2f6f5e','#b5523b','#2d5b8a','#a3781f','#8a3262','#4a4a7a','#3d7a3a'];
const F = $('#frm');
const fv = n => F.elements.namedItem(n);

let books = [];
try { books = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { books = []; }
if (!Array.isArray(books)) books = [];

let tab = 'lendo', rating = 0, editId = null, armed = false;

function persist(){ try { localStorage.setItem(KEY, JSON.stringify(books)); } catch (e) {} }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function hue(t){ let h = 7; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function stars(n){ return n ? '★'.repeat(n) + '☆'.repeat(5 - n) : '–'; }
function fmt(n){ return Number(n).toLocaleString('pt-BR'); }
function pct(b){ if (b.status === 'lido') return 100; const t = +b.pages; if (!t) return 0; return Math.min(100, Math.round((+b.current || 0) / t * 100)); }
function readingList(list){
  return `<section class="reading">${list.map(b => { const p = pct(b); return `<button class="rd" data-id="${b.id}"><span class="rd-top"><b>${esc(b.title)}</b><em>${p}%</em></span><span class="bar"><i style="width:${p}%;background:${b.color || 'var(--accent)'}"></i></span><span class="rd-sub">${esc(b.author || 'Autor desconhecido')}${b.pages ? ` · ${fmt(+b.current || 0)} de ${fmt(b.pages)} págs` : ''}</span></button>`; }).join('')}</section>`;
}
function hoje(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function mesNome(ym){
  if (!ym) return 'Sem data';
  const [y, m] = ym.split('-');
  const s = new Date(+y, +m - 1, 1).toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  return s[0].toUpperCase() + s.slice(1);
}

function shelf(arr){
  return `<div class="shelf">${arr.map(b => `
    <button class="bk" data-id="${b.id}" aria-label="${esc(b.title)}">
      <span class="spine" style="background:${b.color || 'hsl(' + hue(b.title) + ' 38% 36%)'}">${esc(b.title.slice(0, 40))}</span>
      <small>${stars(b.rating)}</small>
    </button>`).join('')}</div>`;
}

function render(){
  const y = String(new Date().getFullYear());
  const lidos = books.filter(b => b.status === 'lido');
  const ano = lidos.filter(b => (b.month || '').startsWith(y));
  const pags = ano.reduce((s, b) => s + (+b.pages || 0), 0);
  const rated = lidos.filter(b => b.rating);
  const media = rated.length ? (rated.reduce((s, b) => s + b.rating, 0) / rated.length).toFixed(1).replace('.', ',') : '–';
  $('#summary').textContent = books.length
    ? `${ano.length} lidos em ${y}, ${fmt(pags)} páginas, nota média ${media}.`
    : 'Sua estante está vazia. Adicione o que você quer ler ou já leu.';

  $('#tabs').innerHTML = Object.entries(ST).map(([k, l]) =>
    `<button role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}" data-tab="${k}">${l} <small>${books.filter(b => b.status === k).length}</small></button>`
  ).join('');

  const list = books.filter(b => b.status === tab);
  let html = '';
  if (!list.length) {
    html = `<p class="empty">${
      tab === 'lido' ? 'Nenhum livro lido ainda. Ao terminar um, mude a estante para Lidos e escolha o mês.'
      : tab === 'lendo' ? 'Nenhum livro em andamento.'
      : 'Sua lista de desejos está vazia.'}</p>`;
  } else if (tab === 'lido') {
    const g = {};
    list.forEach(b => { const k = b.month || ''; (g[k] = g[k] || []).push(b); });
    Object.keys(g).sort().reverse().forEach(k => {
      html += `<section class="month"><h2>${mesNome(k)}<span>${g[k].length} ${g[k].length > 1 ? 'livros' : 'livro'}</span></h2>${shelf(g[k])}</section>`;
    });
  } else {
    html = tab === 'lendo' ? readingList(list) : `<section class="month">${shelf(list)}</section>`;
  }
  $('#main').innerHTML = html;
}

function setStars(n){
  rating = n;
  $('#stars').innerHTML = [1, 2, 3, 4, 5].map(i =>
    `<button type="button" class="st${i <= n ? ' on' : ''}" data-r="${i}" aria-label="${i} ${i > 1 ? 'estrelas' : 'estrela'}">★</button>`
  ).join('');
}

function toggleMes(){ $('#mesWrap').hidden = fv('status').value !== 'lido'; $('#pagWrap').hidden = fv('status').value !== 'lendo'; }

function openDlg(id){
  editId = id;
  armed = false;
  const b = id ? books.find(x => x.id === id) : null;
  F.reset();
  $('#del').textContent = 'Excluir';
  $('#dlgTitle').textContent = b ? 'Editar livro' : 'Novo livro';
  $('#del').hidden = !b;
  if (b) {
    fv('title').value = b.title;
    fv('author').value = b.author || '';
    fv('pages').value = b.pages || '';
    fv('status').value = b.status;
    fv('month').value = b.month || '';
    fv('current').value = b.current || '';
    fv('color').value = b.color || CORES[0];
    fv('review').value = b.review || '';
  } else {
    fv('status').value = tab;
    fv('color').value = CORES[books.length % CORES.length];
  }
  setStars(b ? (b.rating || 0) : 0);
  toggleMes();
  $('#dlg').showModal();
}

$('#add').onclick = () => openDlg(null);
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; render(); } };
$('#main').onclick = e => { const b = e.target.closest('[data-id]'); if (b) openDlg(b.dataset.id); };
$('#stars').onclick = e => { const b = e.target.closest('[data-r]'); if (b) { const n = +b.dataset.r; setStars(n === rating ? 0 : n); } };
fv('status').addEventListener('change', toggleMes);
$('#cancel').onclick = () => $('#dlg').close();

F.addEventListener('submit', e => {
  e.preventDefault();
  const s = fv('status').value;
  const data = {
    title: fv('title').value.trim(),
    author: fv('author').value.trim(),
    pages: Math.max(0, +fv('pages').value || 0),
    status: s,
    month: s === 'lido' ? (fv('month').value || hoje()) : '',
    rating,
    review: fv('review').value.trim(),
    color: fv('color').value,
    current: s === 'lendo' ? Math.max(0, +fv('current').value || 0) : 0
  };
  if (editId) books = books.map(b => b.id === editId ? {...b, ...data} : b);
  else books.push({id: uid(), ...data});
  persist();
  $('#dlg').close();
  tab = s;
  render();
});

$('#del').onclick = () => {
  if (!editId) return;
  if (!armed) {
    armed = true;
    $('#del').textContent = 'Clique de novo para excluir';
    return;
  }
  books = books.filter(b => b.id !== editId);
  persist();
  $('#dlg').close();
  render();
};

render();
</script>
</body>
</html>
